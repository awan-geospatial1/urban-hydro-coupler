version: '3.8'

services:
  coupler-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
      - ../data/outputs:/app/data/outputs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  coupler-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
